<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="660" viewBox="0 0 1280 660" role="img" aria-labelledby="title desc">
  <title id="title">Imagine if every repository showed its files collapsed like this.</title>
  <desc id="desc">GitHub Collapse Repo folds a file list into one compact bar. An upward arrow points toward the actual Folders and Files directory above the README on GitHub. Stylized illustration.</desc>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" fill="#79c0ff">
    <path d="M88 80V14m-18 18 18-18 18 18" fill="none" stroke="#79c0ff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="134" y="39" font-size="26" font-weight="600">Imagine if every repository showed</text>
    <text x="134" y="73" font-size="26" font-weight="600">its files collapsed like this.</text>
  </g>
  <g transform="translate(0 100)">
  <defs>
    <linearGradient id="canvas" x2="1" y2="1"><stop stop-color="#0d1117"/><stop offset="1" stop-color="#15263e"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#79c0ff"/><stop offset="1" stop-color="#a5e9df"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#79c0ff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1280" height="560" rx="24" fill="url(#canvas)"/>
  <rect width="1280" height="560" rx="24" fill="url(#grid)"/>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="64" y="67" width="32" height="32" rx="8" fill="#2f81f7"/>
    <path d="m73 80 7 7 7-7" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="109" y="89" font-size="17" font-weight="600" fill="#e6edf3">GITHUB COLLAPSE REPO</text>
    <text x="60" y="213" font-size="66" font-weight="750" letter-spacing="-2" fill="#f0f6fc">Less scrolling.</text>
    <text x="60" y="290" font-size="66" font-weight="750" letter-spacing="-2" fill="url(#accent)">More README.</text>
    <text x="64" y="345" font-size="21" fill="#b1bed0">Your files. One tidy bar. Room to breathe.</text>
    <path d="M64 395h48" stroke="#58a6ff" stroke-width="3"/>
    <text x="64" y="438" font-size="16" fill="#b1bed0">ONE CLICK TO EXPAND</text>
    <text x="64" y="466" font-size="16" fill="#b1bed0">ZERO RUNTIME DEPENDENCIES</text>
    <rect x="687" y="67" width="529" height="424" rx="16" fill="#010409" opacity=".35"/>
    <rect x="679" y="59" width="529" height="424" rx="16" fill="#0d1117" stroke="#35465b"/>
    <path d="M695 59h497a16 16 0 0 1 16 16v34H679V75a16 16 0 0 1 16-16Z" fill="#161e2b"/>
    <circle cx="704" cy="84" r="5" fill="#78899d"/>
    <circle cx="722" cy="84" r="5" fill="#78899d"/>
    <circle cx="740" cy="84" r="5" fill="#78899d"/>
    <text x="767" y="89" font-size="13" fill="#b1bed0">a little less clutter / a lot more context</text>
    <text x="705" y="146" font-size="17" font-weight="600" fill="#79c0ff">your-next-favorite / project</text>
    <rect x="703" y="167" width="481" height="46" rx="7" fill="#172334" stroke="#3d5773"/>
    <path d="M718 183h8l3 3h9v13h-20Z" fill="#79c0ff"/>
    <text x="749" y="195" font-size="14" font-weight="600" fill="#f0f6fc">Folders and Files</text>
    <text x="929" y="195" font-size="12" fill="#b1bed0">Expand</text>
    <path d="m1152 187 6 6 6-6" fill="none" stroke="#79c0ff" stroke-width="2"/>
    <rect x="703" y="232" width="481" height="225" rx="7" fill="#101925" stroke="#35465b"/>
    <text x="724" y="263" font-size="12" font-weight="600" fill="#b1bed0">README.md</text>
    <path d="M703 277h481" stroke="#35465b"/>
    <text x="726" y="319" font-size="29" font-weight="700" fill="#f0f6fc">Hello, context.</text>
    <rect x="727" y="342" width="368" height="7" rx="3.5" fill="#35465b"/>
    <rect x="727" y="361" width="407" height="7" rx="3.5" fill="#35465b"/>
    <rect x="727" y="380" width="277" height="7" rx="3.5" fill="#35465b"/>
    <rect x="727" y="410" width="124" height="25" rx="5" fill="#203f36"/>
    <text x="742" y="427" font-size="12" fill="#a5e9bf">Room to explore</text>
    <text x="1206" y="522" text-anchor="end" font-size="12" letter-spacing="2" fill="#b1bed0">FOLD THE FILES. FIND THE STORY.</text>
  </g>
  </g>
</svg>
